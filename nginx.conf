proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=pb_cache:10m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~* /(api/realtime|api/collections/.*/records/.*) {
        if ($request_method != GET) {
            proxy_pass http://pocketbase:8090;
        }
        
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        
        proxy_buffering off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    location /api/ {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Turn on Caching
        proxy_cache pb_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        
        # Only cache successful public GET requests
        proxy_cache_methods GET;
        proxy_cache_valid 200 302 5m; # Cache hits last for 5 minutes
        proxy_cache_valid 404      1m;
        
        # Custom header to debug if you are hitting the cache or missing
        add_header X-Cache-Status $upstream_cache_status;
        
        # Bypass cache if Auth headers are present (prevents user leakage)
        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;
    }
}
